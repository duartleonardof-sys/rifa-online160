
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d35">
<title>Administrador | Rifa Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;font-family:Arial,sans-serif;color:#172033}
header{background:#101d35;color:white;text-align:center;padding:22px 15px}
header h1{margin:0 0 6px}
main{max-width:950px;margin:22px auto;padding:0 14px}
.panel{background:white;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 3px 14px #14213b12}
label{display:block;font-weight:bold;font-size:14px;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #ccd2dc;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;padding:12px 16px;font-size:14px;font-weight:bold;cursor:pointer}
.primary{background:#101d35;color:white;width:100%;margin-top:15px}
.cancel{background:#fee2e2;color:#991b1b}
.logout{background:#e5e7eb;color:#172033}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:#f3f5f8;padding:14px;border-radius:10px;text-align:center}
.stat strong{display:block;font-size:24px}
.stat span{font-size:12px;color:#667085}
.hidden{display:none}
.message{font-size:14px;margin-top:12px}
.error{color:#b42318}
.success{color:#067647}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:11px 9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}
th{background:#f8fafc}
.status{font-weight:bold}
.confirmada{color:#067647}
.cancelada{color:#b42318}
.search{margin-bottom:14px}
small{color:#667085}
</style>
</head>
<body>

<header>
<h1>PAINEL ADMINISTRATIVO</h1>
<p>Rifa Premiada | Controle de vendas</p>
</header>

<main>

<section class="panel" id="loginPanel">
<h2>Acesso do administrador</h2>
<label for="email">E-mail</label>
<input id="email" type="email" value="duart.leonardof@gmail.com">
<label for="password">Senha</label>
<input id="password" type="password" placeholder="Digite sua senha">
<button class="primary" id="loginBtn">Entrar</button>
<div id="loginMessage" class="message"></div>
</section>

<section id="adminPanel" class="hidden">

<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<div>
<h2 style="margin:0">Controle da rifa</h2>
<small>Administrador conectado</small>
</div>
<button class="logout" id="logoutBtn">Sair</button>
</div>
</div>

<div class="panel">
<div class="stats">
<div class="stat"><strong id="total">160</strong><span>Total de números</span></div>
<div class="stat"><strong id="sold">0</strong><span>Vendas confirmadas</span></div>
<div class="stat"><strong id="available">160</strong><span>Disponíveis</span></div>
<div class="stat"><strong id="canceled">0</strong><span>Canceladas</span></div>
</div>
</div>

<div class="panel">
<h2>Vendas registradas</h2>
<input class="search" id="search" placeholder="Pesquisar número, comprador, telefone ou vendedor">
<button class="primary" id="refreshBtn">Atualizar vendas</button>
<div id="salesMessage" class="message"></div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Número</th>
<th>Comprador</th>
<th>WhatsApp</th>
<th>Vendedor</th>
<th>Data</th>
<th>Status</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="salesBody"></tbody>
</table>
</div>
</div>

</section>
</main>

<script>
const SUPABASE_URL="https://bjwyirlhkmaknkbpxizr.supabase.co";
const SUPABASE_KEY="sb_publishable_7omXPv_qL2lnpicNB0I58A_-3bVFKj8";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let vendas=[];

const loginPanel=document.getElementById("loginPanel");
const adminPanel=document.getElementById("adminPanel");
const loginMessage=document.getElementById("loginMessage");
const salesMessage=document.getElementById("salesMessage");

function message(el,text,type=""){
el.textContent=text;
el.className="message "+type;
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

async function verificarSessao(){
const {data}=await db.auth.getSession();
if(data.session){
await carregarVendas();
}else{
loginPanel.classList.remove("hidden");
adminPanel.classList.add("hidden");
}
}

document.getElementById("loginBtn").addEventListener("click",async()=>{
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

message(loginMessage,"Verificando acesso...");

const {error}=await db.auth.signInWithPassword({email,password});

if(error){
message(loginMessage,"E-mail ou senha incorretos, ou acesso não autorizado.","error");
return;
}

message(loginMessage,"Acesso autorizado.","success");
await carregarVendas();
});

async function carregarVendas(){
loginPanel.classList.add("hidden");
adminPanel.classList.remove("hidden");
message(salesMessage,"Carregando vendas...");

const {data,error}=await db
.from("rifa_vendas")
.select("numero,comprador_nome,comprador_telefone,vendedor_nome,criado_em,status")
.order("criado_em",{ascending:false});

if(error){
message(salesMessage,"Erro ao consultar vendas: "+error.message,"error");
return;
}

vendas=data||[];
atualizarTela();
message(salesMessage,"Vendas atualizadas.","success");
}

function atualizarTela(){
const confirmadas=vendas.filter(v=>v.status==="confirmada");
const canceladas=vendas.filter(v=>v.status==="cancelada");

document.getElementById("sold").textContent=confirmadas.length;
document.getElementById("canceled").textContent=canceladas.length;
document.getElementById("available").textContent=160-confirmadas.length;

const busca=document.getElementById("search").value.toLowerCase().trim();

const filtradas=vendas.filter(v=>
[
v.numero,v.comprador_nome,v.comprador_telefone,v.vendedor_nome,v.status
].some(x=>String(x??"").toLowerCase().includes(busca))
);

const tbody=document.getElementById("salesBody");
tbody.innerHTML="";

if(!filtradas.length){
tbody.innerHTML='<tr><td colspan="7">Nenhuma venda encontrada.</td></tr>';
return;
}

filtradas.forEach(v=>{
const tr=document.createElement("tr");
const data=v.criado_em?new Date(v.criado_em).toLocaleString("pt-BR"):"-";
const numero=String(v.numero).padStart(3,"0");
const status=v.status||"confirmada";

tr.innerHTML=`
<td><strong>${numero}</strong></td>
<td>${escapeHTML(v.comprador_nome)}</td>
<td>${escapeHTML(v.comprador_telefone)}</td>
<td>${escapeHTML(v.vendedor_nome)}</td>
<td>${escapeHTML(data)}</td>
<td class="status ${status}">${status==="cancelada"?"Cancelada":"Confirmada"}</td>
<td>
${status==="confirmada"
?`<button class="cancel" data-numero="${Number(v.numero)}">Cancelar</button>`
:"-"}
</td>`;

tbody.appendChild(tr);
});
}

document.getElementById("salesBody").addEventListener("click",async e=>{
const btn=e.target.closest("button[data-numero]");
if(!btn)return;

const numero=Number(btn.dataset.numero);

if(!confirm("Deseja cancelar a venda do número "+String(numero).padStart(3,"0")+"? O número ficará disponível novamente."))return;

btn.disabled=true;
btn.textContent="Cancelando...";

const {error}=await db.rpc("cancelar_venda_rifa",{
p_numero:numero
});

if(error){
alert("Não foi possível cancelar: "+error.message);
btn.disabled=false;
btn.textContent="Cancelar";
return;
}

alert("Venda cancelada! O número foi liberado.");
await carregarVendas();
});

document.getElementById("refreshBtn").addEventListener("click",carregarVendas);
document.getElementById("search").addEventListener("input",atualizarTela);

document.getElementById("logoutBtn").addEventListener("click",async()=>{
await db.auth.signOut();
vendas=[];
adminPanel.classList.add("hidden");
loginPanel.classList.remove("hidden");
document.getElementById("password").value="";
message(loginMessage,"Você saiu do painel.");
});

verificarSessao();
</script>
</body>
</html>
